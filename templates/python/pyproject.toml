[project]
name = "macch-plugin-template"
version = "0.1.0"
description = "Template MCP server for a Macch plugin."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
